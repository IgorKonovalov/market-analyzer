[project]
name = "market-analyser"
version = "0.0.1"
description = "Desktop trading-analysis app: Electron shell + Python sidecar."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Igor Konovalov" }]
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.136.1",
    "pydantic==2.13.3",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pip-audit==2.10.0",
    "pre-commit==4.6.0",
    "commitizen==4.15.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "2026-05-05"

[tool.hatch.build.targets.wheel]
packages = ["src/market_analyser"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".claude",
    "desktop",
    "docs",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI requires Query/Path/Body/Depends as parameter defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "network: tests that hit the live network (skipped in CI by default)",
]

[tool.coverage.run]
branch = true
source = ["src/market_analyser"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version = "0.0.1"
update_changelog_on_bump = false
