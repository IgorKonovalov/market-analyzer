name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Stub workflow: builds and checksums the sdist/wheel on tag push. Does not
# publish anywhere yet — packaging/publishing wiring is a future plan, per
# Plan 0001 "Followups".

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Checksum artifacts
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
