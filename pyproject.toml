[project]
name = "market-analyser"
version = "0.14.0"
description = "Desktop trading-analysis app: Electron shell + Python sidecar."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Igor Konovalov" }]
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.136.1",
    "feedparser==6.0.11",
    "mcp==1.27.1",
    "psutil==7.2.2",
    "pydantic==2.13.3",
    "python-dotenv==1.2.2",
    "scikit-learn==1.8.0",
    "sqlalchemy==2.0.49",
    "statsmodels==0.14.6",
    "tradingview-screener==3.2.0",
    "uvicorn[standard]==0.46.0",
    "vadersentiment==3.3.2",
]

[project.scripts]
market-analyser = "market_analyser.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pip-audit==2.10.0",
    "pre-commit==4.6.0",
    "commitizen==4.15.0",
    "types-psutil==7.2.2.20260508",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.uv]
# Advanced past 2026-06-19 to admit the fixes for the 2026-07-03 pip-audit
# batch (CVE-driven bump per CLAUDE.md; all five are transitive): starlette
# 1.3.1, python-multipart 0.0.31, cryptography 48.0.1, msgpack 1.2.1,
# pydantic-settings 2.14.2.
exclude-newer = "2026-07-03"

[tool.hatch.build.targets.wheel]
packages = ["src/market_analyser"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".claude",
    "desktop",
    "docs",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI requires Query/Path/Body/Depends as parameter defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# feedparser and vaderSentiment ship no type information (no py.typed, no stubs
# on typeshed). Their output is treated as untrusted at the boundary and
# extracted defensively (rss_news.py, _vader.py), so the dynamic typing stays
# contained to those adapters.
module = ["feedparser", "vaderSentiment.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn, statsmodels, threadpoolctl, and joblib ship no py.typed marker
# mypy recognises. The forecasting subsystem (Plan 0036) treats their output as
# untrusted at the boundary — the model layer keeps the dynamic typing contained
# to forecast/model.py and forecast/registry.py (joblib persistence).
module = ["sklearn.*", "statsmodels.*", "threadpoolctl", "joblib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "network: tests that hit the live network (skipped in CI by default)",
]

[tool.coverage.run]
branch = true
source = ["src/market_analyser"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
# Single source of truth is [project].version above (read/written by the pep621
# provider); desktop/package.json is synced from it on `cz bump`. major_version_zero
# keeps us in the 0.x band — feat -> minor, fix -> patch, breaking -> minor (never
# an accidental 1.0.0). Bump runs once per plan in the architect close ceremony. ADR-0087.
version_provider = "pep621"
major_version_zero = true
version_files = [
    "desktop/package.json:\"version\":",
]
update_changelog_on_bump = false
