name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync project
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Guard against committed mcp-secret*.json (Plan 0006 phase 1 risk mitigation)
        shell: bash
        run: |
          matches=$(git ls-files src desktop tests | grep -E '(^|/)mcp-secret[^/]*\.json$' || true)
          if [ -n "$matches" ]; then
            echo "ERROR: found mcp-secret*.json file(s) tracked under src/, desktop/, or tests/:"
            echo "$matches"
            echo "MCP secrets must live only in the user data directory at runtime, never in the repo."
            exit 1
          fi

      - name: Mypy (strict)
        run: uv run mypy --strict src tests

      - name: Pytest with coverage (excludes @pytest.mark.network per Plan 0001)
        run: uv run pytest -m "not network" --cov=src --cov-fail-under=85

      - name: pip-audit
        run: uv run pip-audit

  desktop-types:
    # Verifies `desktop/renderer/types/sidecar/*.ts` is in sync with the
    # Pydantic models served by FastAPI. Plan 0004 phase 6 picked commit-time
    # (over build-time) gen-types specifically so CI can catch drift here.
    name: Desktop type-sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --frozen

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install desktop deps
        run: pnpm install --frozen-lockfile

      - name: gen-types --check
        run: pnpm --filter desktop gen-types:check
